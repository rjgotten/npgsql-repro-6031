name: npgsql-repro-6031

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repro
    ports:
      # Exposed so `dotnet run` on the host can use the same database. Override with POSTGRES_PORT if 5432 is taken.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h localhost forces TCP, which only listens once the image's init phase has finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d repro"]
      interval: 2s
      timeout: 5s
      retries: 30

  repro:
    build:
      context: .
      dockerfile: src/Repro/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=repro;Username=postgres;Password=postgres"
      # Every Repro:* setting in src/Repro/appsettings.json can be overridden here or with `docker compose run -e`.
      # Repro__Container: Autofac                   # MsDi | Autofac
      # Repro__ContextRegistration: PooledFactory   # Plain | Pool | PooledFactory
      # Repro__AliasRegistration: "true"            # scope tracks the context twice
      # Repro__ExtraDisposeProbability: "0.2"       # app code disposes the injected context
      # Repro__Concurrency: "32"
      # Repro__ScopeDisposal: Sync                  # Async | Sync
      # Repro__DoubleDisposeMode: PassThroughSwallow # PassThrough | PassThroughSwallow | Skip
      # Repro__CancelProbability: "0.2"
      # Repro__AbandonReaderProbability: "0.1"      # needs Repro__RetryOnFailure: "false"
      # Repro__RetryOnFailure: "false"
      # Repro__Interval: "00:05:00"
      # Repro__Duration: "00:01:00"
      # Repro__SelfTest: "true"
