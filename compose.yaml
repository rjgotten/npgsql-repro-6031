name: npgsql-repro-6031

# Shared settings for the two scenarios. Run one at a time: `docker compose run --rm race` or `... alias`.
# They need the database but no schema or data.
x-scenario: &scenario
  profiles: ["scenarios"]
  depends_on:
    db:
      condition: service_healthy
  environment:
    REPRO_CONNECTION: "Host=db;Port=5432;Database=repro;Username=postgres;Password=postgres"

services:
  db:
    image: postgres:14
    # Headroom for the scenarios' large client pool, which keeps leaked slots from starving the bystanders.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repro
    ports:
      # Exposed so `dotnet run` on the host can use the same database. Override with POSTGRES_PORT if 5432 is taken.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h localhost forces TCP, which only listens once the image's init phase has finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d repro"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A DI scope ends while fire-and-forget work on its DbContext still runs.
  #   docker compose run --rm race [--registration plain|pool] [--seconds 5] [--quiet 20] [--loops 16] [--bystanders 8]
  race:
    <<: *scenario
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        PROJECT: Repro.Race

  # AddPooledDbContextFactory plus a forwarding interface registration: the scope disposes the context twice.
  #   docker compose run --rm alias [--registration factory|pool] [--resolve alias|direct] [--seconds 20] [--quiet 20]
  alias:
    <<: *scenario
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        PROJECT: Repro.Alias
